configuration:
  hub_name:
    name: Имя хаба Modbus
    description: >-
      Только начальное значение. Дальше имя меняется на главном экране
      дополнения и хранится в /data/settings.json.
  device:
    name: Последовательный порт
    description: Начальный путь, например /dev/ttyUSB0. На экране список by-id и ttyUSB.
  baudrate:
    name: Скорость
    description: Начальная скорость порта.
  parity:
    name: Чётность
    description: N, E или O. Начальное значение.
  stopbits:
    name: Стоп-биты
    description: Начальное значение, обычно 1.
  bytesize:
    name: Биты данных
    description: Начальное значение, для Modbus RTU обычно 8.
  timeout:
    name: Таймаут ответа, с
    description: Начальный таймаут. На экране меняется сразу.
  inter_frame_delay:
    name: Пауза между кадрами, с
    description: 0 — не меньше 3.5 символа и 15 мс.
  retries:
    name: Повторы
    description: Сколько раз повторить запрос, если ответа не было. 0 — один раз.
