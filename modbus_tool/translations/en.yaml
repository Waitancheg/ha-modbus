configuration:
  hub_name:
    name: Modbus hub name
    description: Initial value only. The panel stores later changes in /data/settings.json.
  device:
    name: Serial port
    description: Initial path, for example /dev/ttyUSB0.
  baudrate:
    name: Baud rate
    description: Initial port speed.
  parity:
    name: Parity
    description: Initial value, N, E or O.
  stopbits:
    name: Stop bits
    description: Initial value, usually 1.
  bytesize:
    name: Data bits
    description: Initial value, usually 8 for Modbus RTU.
  timeout:
    name: Response timeout, s
    description: Initial timeout. The panel applies changes immediately.
  inter_frame_delay:
    name: Inter-frame gap, s
    description: 0 uses at least 3.5 character times and 15 ms.
  retries:
    name: Retries
    description: Extra attempts when no reply arrives. 0 means a single try.
