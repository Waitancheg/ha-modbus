name: Modbus RTU Tool
version: "0.1.0"
slug: modbus_tool
description: >-
  Сканирование и настройка устройств Modbus RTU на шине RS485
  через USB-адаптер. Веб-интерфейс в боковой панели Home Assistant.
url: https://github.com/Waitancheg/ha-modbus/tree/main/modbus_tool
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: manual
uart: true
udev: true
devices:
  - /dev/ttyUSB0
  - /dev/ttyUSB1
  - /dev/ttyUSB2
  - /dev/ttyACM0
  - /dev/ttyAMA0
  - /dev/ttyS0
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:serial-port
panel_title: Modbus RTU
panel_admin: true
options:
  hub_name: ""
  device: /dev/ttyUSB0
  baudrate: 9600
  parity: "N"
  stopbits: 1
  timeout: 0.25
  inter_frame_delay: 0
  echo_guard: 0.005
  auto_release_hub: true
schema:
  hub_name: str
  device: str
  baudrate: "list(1200|2400|4800|9600|19200|38400|57600|115200)"
  parity: "list(N|E|O)"
  stopbits: "list(1|2)"
  timeout: "float(0.05,10)"
  inter_frame_delay: "float(0,2)"
  echo_guard: "float(0,0.2)"
  auto_release_hub: bool
