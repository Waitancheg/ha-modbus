id: r4dcb08
name: R4DCB08
subtitle: 8 каналов температуры, holding-регистры 0…7
defaults:
  address: 1
  baudrate: 9600
  parity: "N"
  stopbits: 1
notes:
  - "Температуры в holding-регистрах 0…7, int16, множитель 0.1 °C."
  - "Адрес устройства уточните сканером: у разных партий он отличается."
points:
  - name: Температура 1
    kind: holding
    address: 0
    decode: int16
    scale: 0.1
    precision: 1
    unit: "°C"
    export: sensor
    device_class: temperature
    state_class: measurement
  - name: Температура 2
    kind: holding
    address: 1
